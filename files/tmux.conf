set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'rose-pine/tmux'

set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Sm lx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0
bind r source-file ~/.tmux.conf

set-hook -g client-dark-theme {
  set -g @rose_pine_variant 'main'
  set -g window-status-bell-style 'fg=#191724,bg=#eb6f92,bold,blink'
  run-shell '~/.tmux/plugins/tmux/rose-pine.tmux'
}
set-hook -g client-light-theme {
  set -g @rose_pine_variant 'dawn'
  set -g window-status-bell-style 'fg=#faf4ed,bg=#b4637a,bold,blink'
  run-shell '~/.tmux/plugins/tmux/rose-pine.tmux'
}
set -g @rose_pine_date_time '%H:%M'
set -g @rose_pine_directory 'on'


set -g prefix C-space

set -g set-titles on

set-option -g mouse on
set-option -g detach-on-destroy off

# Visual bell highlighting
set -g visual-bell on
set -g bell-action any
set -g monitor-bell on

set -s escape-time 0
set-option -g history-limit 250000

bind-key H popup -E -h 95% -w 95% -x 5% "htop"
bind-key H popup -E -h 95% -w 95% -x 5% "htop"
bind-key T run-shell 'variant=$(tmux show -gv @rose_pine_variant 2>/dev/null); case "$variant" in dawn) theme=light;; *) theme=dark;; esac; tmux display-popup -E -w 80% -h 80% -T " tmux-overseer " -e "TMUX_OVERSEER_THEME=$theme" tmux-overseer'

# Stop with the annoying questions
bind-key x kill-pane
bind-key & kill-window

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"
bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'
# bind-key -n 'C-o' 'clear-history'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+


bind c new-window      -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind l send-keys -R\; clear-history

set -g base-index 1

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
