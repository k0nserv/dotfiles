# font_family      family='Fira Code' postscript_name=FiraCode-Regular
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
# BEGIN_KITTY_FONTS
font_family      family='Fira Code' variable_name=FiraCodeRoman style=FiraCodeRoman-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
font_size 14.0
adjust_line_height 125%
disable_ligatures never
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font 

window_margin_width 2 4

macos_titlebar_color background
macos_show_window_title_in none
hide_window_decorations yes
text_composition_strategy 1.3 5

allow_remote_control yes
listen_on unix:/tmp/kitty-ctrl
